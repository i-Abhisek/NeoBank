spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: accounts-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/accounts/**

            - id: transaction-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/transactions/**

            - id: payment-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/payments/**

server:
  port: 8080

management:
  endpoint:
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health,info,gateway